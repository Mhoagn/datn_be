# =============================================
# [PROD] Database - Railway MySQL Plugin
# Railway inject: MYSQLHOST, MYSQLPORT, MYSQLUSER, MYSQLPASSWORD, MYSQLDATABASE
# =============================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# =============================================
# [PROD] JPA - Tắt show SQL
# =============================================
spring.jpa.show-sql=false

# =============================================
# [PROD] Redis - Railway Redis Plugin
# Railway inject: REDISHOST, REDISPORT, REDISPASSWORD, REDISUSER
# =============================================
spring.redis.host=${REDISHOST}
spring.redis.port=${REDISPORT:6379}
spring.redis.password=${REDISPASSWORD}
spring.redis.username=${REDISUSER:default}

# =============================================
# [PROD] Email credentials
# Thêm Railway env: MAIL_USERNAME, MAIL_PASSWORD
# =============================================
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# =============================================
# [PROD] Cloudinary
# Thêm Railway env: CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
# =============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =============================================
# [PROD] JWT Secrets
# Thêm Railway env: JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
# =============================================
app.jwt.access-secret=${JWT_ACCESS_SECRET}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET}

# =============================================
# [PROD] AI Service
# Thêm Railway env: AI_SERVICE_URL
# =============================================
ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# =============================================
# [PROD] WebSocket & CORS
# Thêm Railway env: ALLOWED_ORIGINS, CORS_ALLOWED_ORIGIN
# =============================================
websocket.allowed-origins=${ALLOWED_ORIGINS}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# =============================================
# [PROD] LiveKit
# =============================================
livekit.api-key=${LIVEKIT_API_KEY}
livekit.api-secret=${LIVEKIT_API_SECRET}
livekit.ws-url=${LIVEKIT_WS_URL}
livekit.s3.bucket=${LIVEKIT_S3_BUCKET}
livekit.s3.access-key=${LIVEKIT_S3_ACCESS_KEY}
livekit.s3.secret-key=${LIVEKIT_S3_SECRET_KEY}

# =============================================
# [PROD] Logging - tối giản
# =============================================
logging.level.root=WARN
logging.level.com.example.demo=INFO
