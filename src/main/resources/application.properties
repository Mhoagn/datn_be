# =============================================
# Active Profile (Railway override bằng env SPRING_PROFILES_ACTIVE=prod)
# =============================================
spring.application.name=datn-backend
spring.profiles.active=dev

# Railway set PORT tự động, fallback 8080 cho local
server.port=${PORT:8080}

# =============================================
# Database - Driver (URL/credentials ở từng profile)
# =============================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate - Config chung
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# =============================================
# Email - SMTP chung (credentials ở từng profile)
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =============================================
# JWT - Config chung (secrets ở từng profile)
# =============================================
app.jwt.issuer=datn-backend
app.jwt.access-ttl-min=15
app.jwt.refresh-ttl-days=14

# =============================================
# AI Service - Timeout chung (URL ở từng profile)
# =============================================
ai-service.timeout.connect=30000
ai-service.timeout.read=1800000

# =============================================
# LiveKit - S3 region (non-sensitive)
# =============================================
livekit.s3.region=ap-southeast-2

# =============================================
# Jackson
# =============================================
spring.jackson.time-zone=UTC

# =============================================
# Actuator (Health Check cho Railway)
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
